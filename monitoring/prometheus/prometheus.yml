global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fastapi-app"
    dns_sd_configs:
      - names:
          - "devops-project-service.local"
        type: "A"
        port: 8000
    metrics_path: /metrics
    
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
